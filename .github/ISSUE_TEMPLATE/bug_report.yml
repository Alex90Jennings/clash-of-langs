name: Bug report
description: Something is broken or a result looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: battle
    attributes:
      label: Battle URL
      description: The /battle/... URL reproduces the exact battle, including the seed.
      placeholder: http://localhost:3000/battle/javascript-vs-go/sort?seed=48291
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, local or Docker worker, and the runtime versions (from the RAW RESULTS tab).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or raw JSON
      render: shell
