services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CLASHOFLANGS_WORKER_ID: ${CLASHOFLANGS_WORKER_ID:-local-docker}
      CLASHOFLANGS_WORKER_TOKEN: ${CLASHOFLANGS_WORKER_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:size=512m,exec
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpuset: ${CLASHOFLANGS_CPUSET:-2,3}
